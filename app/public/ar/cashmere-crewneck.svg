<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Cashmere crewneck sweater overlay">
  <title>Cashmere Crewneck Sweater — illustrative overlay</title>
  <defs>
    <linearGradient id="cashmereFill" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#2B3149" />
      <stop offset="55%" stop-color="#1E2A44" />
      <stop offset="100%" stop-color="#161E33" />
    </linearGradient>
    <linearGradient id="cashmereSheen" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#E5C158" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#E5C158" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Body: shoulders, sleeves, hem -->
  <path d="M200 34
           c-26 0-46 8-62 16
           L86 74 c-14 7-20 20-22 35
           l-16 116 c-2 14 8 24 21 24 12 0 21-8 23-21
           l14-92 6 214 c1 16 9 24 24 24
           h128 c15 0 23-8 24-24 l6-214 14 92
           c2 13 11 21 23 21 13 0 23-10 21-24
           l-16-116 c-2-15-8-28-22-35
           L262 50 c-16-8-36-16-62-16 Z"
        fill="url(#cashmereFill)" stroke="#E5C158" stroke-opacity="0.45" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Ribbed crewneck collar -->
  <path d="M154 40 c14 16 30 24 46 24 s32-8 46-24"
        fill="none" stroke="#0B0F1A" stroke-opacity="0.85" stroke-width="15" stroke-linecap="round" />
  <path d="M154 40 c14 16 30 24 46 24 s32-8 46-24"
        fill="none" stroke="#E5C158" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round" />

  <!-- Ribbed hem -->
  <path d="M108 322 h184" stroke="#0B0F1A" stroke-opacity="0.5" stroke-width="1.4" />
  <path d="M108 332 h184" stroke="#0B0F1A" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Cuffs -->
  <path d="M62 205 l-4 26" stroke="#0B0F1A" stroke-opacity="0.4" stroke-width="1.4" />
  <path d="M338 205 l4 26" stroke="#0B0F1A" stroke-opacity="0.4" stroke-width="1.4" />

  <!-- Studio sheen -->
  <path d="M200 34 L86 74 l-6 60 c40-26 80-38 120-38 s80 12 120 38 l-6-60 Z" fill="url(#cashmereSheen)" />
</svg>
