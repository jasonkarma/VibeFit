<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Wool-blend blazer overlay">
  <title>Wool-Blend Single-Breasted Blazer — illustrative overlay</title>
  <defs>
    <linearGradient id="blazerFill" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#243352" />
      <stop offset="60%" stop-color="#1B2740" />
      <stop offset="100%" stop-color="#141C2F" />
    </linearGradient>
    <linearGradient id="blazerLapel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2E3E60" />
      <stop offset="100%" stop-color="#1F2B45" />
    </linearGradient>
  </defs>

  <!-- Open-front body with two front panels -->
  <path d="M200 36 c-30 0-52 10-70 20
           L84 82 c-16 8-22 22-24 38
           l-14 122 c-2 14 9 25 22 24 12-1 20-10 22-23
           l12-96 10 236 c1 15 9 23 24 23
           h52 l-14-250 -12-66 Z"
        fill="url(#blazerFill)" stroke="#E5C158" stroke-opacity="0.45" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M200 36 c30 0 52 10 70 20
           L316 82 c16 8 22 22 24 38
           l14 122 c2 14-9 25-22 24-12-1-20-10-22-23
           l-12-96-10 236 c-1 15-9 23-24 23
           h-52 l14-250 12-66 Z"
        fill="url(#blazerFill)" stroke="#E5C158" stroke-opacity="0.45" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Lapels -->
  <path d="M200 40 L162 56 l-8 96 46 60 22-140 Z"
        fill="url(#blazerLapel)" stroke="#E5C158" stroke-opacity="0.35" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M200 40 L238 56 l8 96 -46 60 -22-140 Z"
        fill="url(#blazerLapel)" stroke="#E5C158" stroke-opacity="0.35" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Back neck / collar roll -->
  <path d="M162 52 c14 20 25 28 38 28 s24-8 38-28"
        fill="none" stroke="#0B0F1A" stroke-opacity="0.7" stroke-width="10" stroke-linecap="round" />

  <!-- Single button closure -->
  <circle cx="200" cy="252" r="6" fill="#E5C158" fill-opacity="0.85" />
  <circle cx="200" cy="252" r="9" fill="none" stroke="#E5C158" stroke-opacity="0.3" stroke-width="1.4" />

  <!-- Flap pockets -->
  <path d="M120 300 h56" stroke="#E5C158" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round" />
  <path d="M224 300 h56" stroke="#E5C158" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round" />

  <!-- Sleeve break -->
  <path d="M62 214 l-3 24" stroke="#0B0F1A" stroke-opacity="0.45" stroke-width="1.6" />
  <path d="M338 214 l3 24" stroke="#0B0F1A" stroke-opacity="0.45" stroke-width="1.6" />
</svg>
